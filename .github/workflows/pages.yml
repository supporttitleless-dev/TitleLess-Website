# Publishes this site to GitHub Pages from supporttitleless-dev/TitleLess-Website,
# for titlelessbrowser.com.
#
# Only the site's own pages go out: tools/ and DESIGN.md are for working on
# the site, not part of it, and hidden files (this workflow, .gitignore) stay
# behind. Before upload it does what the old IONOS deploy script did: the
# search index is rebuilt from the pages, and the stylesheet and script links
# are stamped with a hash of their contents, so a changed file arrives under a
# new address instead of from a visitor's cache.
#
# The domain is set in the repository's Pages settings, not by a CNAME file,
# which a workflow deployment ignores. Every link on the site starts from /,
# so the site needs the domain: at the project address
# supporttitleless-dev.github.io/TitleLess-Website/ its styles and links miss.
# The old copy at droidboy08-hub.github.io stays up for the links in TitleLess 1.2.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a running one is never cut off half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: |
          python3 tools/build-search-index.py
          css=$(md5sum assets/site.css | cut -c1-8)
          js=$(md5sum assets/site.js | cut -c1-8)
          mkdir ../_site
          rsync -a --exclude tools --exclude DESIGN.md --exclude '.*' ./ ../_site/
          find ../_site -name '*.html' -exec sed -i -E \
            -e "s|(/assets/site\.css)(\?v=[a-f0-9]+)?|\1?v=$css|g" \
            -e "s|(/assets/site\.js)(\?v=[a-f0-9]+)?|\1?v=$js|g" {} +
          mv ../_site _site
          echo "stamped css v=$css  js v=$js"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
